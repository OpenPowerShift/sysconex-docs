name: Nightly Deploy to GitHub Pages
on:
  schedule:
    # Rebuild and redeploy the site every night at 02:00 UTC so that changes
    # pulled in from the plugin repositories are picked up automatically.
    - cron: '0 2 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: false
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Antora with the Antora Lunr Extension
        run: npm i antora @antora/lunr-extension
      - name: Generate Site
        run: npx antora antora-playbook.yml
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
